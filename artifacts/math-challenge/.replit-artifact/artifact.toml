kind = "mobile"
previewPath = "/math-challenge/"
title = "4-Minute Math Challenge"
description = "A fast competitive mobile math game where players choose an operation and difficulty, solve as many problems as possible in four minutes, and review their score."
version = "1.0.0"
id = "artifacts/math-challenge"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/math-challenge/" ]
localPort = 20537

[services.development]
run = "pnpm --filter @workspace/math-challenge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/math-challenge", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/math-challenge", "run", "serve" ]

[services.env]
PORT = "20537"
BASE_PATH = "/math-challenge/"
